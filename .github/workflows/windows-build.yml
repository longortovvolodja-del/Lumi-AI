name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Prepare Lumi application icon
        shell: pwsh
        run: |
          python -m pip install Pillow
          @'
          from pathlib import Path
          from PIL import Image

          output = Path("dist")
          output.mkdir(exist_ok=True)
          icon = Image.open("assets/lumi-app-icon.png").convert("RGBA")
          icon.save(output / "lumi.ico", format="ICO", sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@ | Set-Content -Encoding utf8 prepare_icon.py
          python prepare_icon.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item prepare_icon.py

      - name: Build Windows application
        run: >
          pyinstaller --noconfirm --clean --windowed --name Lumi
          --icon dist/lumi.ico
          --add-data "assets;assets"
          --paths src src/lumi/__main__.py

      - name: Write installed version marker
        shell: pwsh
        run: |
          $version = python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('src/lumi/__init__.py', encoding='utf-8').read()).group(1))"
          Set-Content -Path "dist/Lumi/version.txt" -Value $version -Encoding ascii

      - name: Build Lumi updater
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed --name LumiUpdater
          --paths src src/lumi/updater.py

      - name: Upload application artifact
        if: startsWith(github.ref, 'refs/heads/') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Lumi-Windows
          path: dist/Lumi/
          if-no-files-found: error

      - name: Prepare Lumi installer artwork
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          from PIL import Image, ImageOps

          output = Path("dist")
          navy = (8, 13, 37)
          source = Image.open("assets/Lumi AI_ Неоновый помощник-лисёнок.png").convert("RGB")
          wizard = Image.new("RGB", (164, 314), navy)
          artwork = ImageOps.contain(source, (156, 306), method=Image.Resampling.LANCZOS)
          wizard.paste(artwork, ((164-artwork.width)//2, (314-artwork.height)//2))
          wizard.save(output / "installer-wizard.bmp")
          icon = Image.open("assets/lumi-app-icon.png").convert("RGB")
          small = Image.new("RGB", (55, 55), navy)
          avatar = ImageOps.contain(icon, (51, 51), method=Image.Resampling.LANCZOS)
          small.paste(avatar, ((55-avatar.width)//2, (55-avatar.height)//2))
          small.save(output / "installer-small.bmp")
          '@ | Set-Content -Encoding utf8 prepare_installer_art.py
          python prepare_installer_art.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item prepare_installer_art.py

      - name: Install Inno Setup
        if: startsWith(github.ref, 'refs/tags/v')
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          & "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer/lumi.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate installer checksum
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $installer = Get-Item "dist/Lumi-Setup-*.exe"
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer.Name)" | Out-File -Encoding ascii dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Lumi AI ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/Lumi-Setup-*.exe
            dist/SHA256SUMS.txt
