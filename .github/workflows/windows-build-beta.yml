name: Windows build Beta

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Основная версия беты, например 0.1.8"
        required: true
        default: "0.1.8"
        type: string
      beta_number:
        description: "Номер бета-сборки от 1 до 5 цифр, например 1"
        required: true
        default: "1"
        type: string
      changes:
        description: "Что добавлено или исправлено"
        required: true
        default: "Первый тестовый выпуск Lumi AI 0.1.8."
        type: string

permissions:
  contents: write

jobs:
  beta-build:
    runs-on: windows-latest
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4

      - name: Validate beta version
        shell: pwsh
        env:
          APP_VERSION: ${{ inputs.version }}
          BETA_NUMBER: ${{ inputs.beta_number }}
        run: |
          if ($env:APP_VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw "Укажи основную версию в формате X.Y.Z, например 0.1.8."
          }
          if ($env:BETA_NUMBER -notmatch '^\d{1,5}$') {
            throw "Номер бета-сборки должен содержать от 1 до 5 цифр."
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Prepare Lumi application icon
        shell: pwsh
        run: |
          python -m pip install Pillow
          @'
          from pathlib import Path
          from PIL import Image
          output = Path("dist")
          output.mkdir(exist_ok=True)
          icon = Image.open("assets/lumi-app-icon.png").convert("RGBA")
          icon.save(output / "lumi.ico", format="ICO", sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@ | Set-Content -Encoding utf8 prepare_icon.py
          python prepare_icon.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item prepare_icon.py

      - name: Build Windows application
        run: >
          pyinstaller --noconfirm --clean --windowed --name Lumi
          --icon dist/lumi.ico
          --add-data "assets;assets"
          --paths src --hidden-import lumi.main --hidden-import lumi.storage src/lumi/__main__.py

      - name: Write installed beta version marker
        shell: pwsh
        env:
          APP_VERSION: ${{ inputs.version }}
          BETA_NUMBER: ${{ inputs.beta_number }}
        run: |
          Set-Content -Path dist/Lumi/version.txt -Value "$env:APP_VERSION-beta.$env:BETA_NUMBER" -Encoding ascii

      - name: Build Lumi updater
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed --name LumiUpdater
          --paths src src/lumi/updater.py

      - name: Upload beta application artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lumi-Windows-Beta
          path: dist/Lumi/
          if-no-files-found: error

      - name: Prepare Lumi installer artwork
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          from PIL import Image, ImageOps
          output = Path("dist")
          navy = (8, 13, 37)
          source = Image.open("assets/Lumi AI_ Неоновый помощник-лисёнок.png").convert("RGB")
          wizard = Image.new("RGB", (164, 314), navy)
          artwork = ImageOps.contain(source, (156, 306), method=Image.Resampling.LANCZOS)
          wizard.paste(artwork, ((164-artwork.width)//2, (314-artwork.height)//2))
          wizard.save(output / "installer-wizard.bmp")
          icon = Image.open("assets/lumi-app-icon.png").convert("RGB")
          small = Image.new("RGB", (55, 55), navy)
          avatar = ImageOps.contain(icon, (51, 51), method=Image.Resampling.LANCZOS)
          small.paste(avatar, ((55-avatar.width)//2, (55-avatar.height)//2))
          small.save(output / "installer-small.bmp")
          '@ | Set-Content -Encoding utf8 prepare_installer_art.py
          python prepare_installer_art.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item prepare_installer_art.py

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build internal Windows installer
        shell: pwsh
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          New-Item -ItemType Directory -Force dist/payload | Out-Null
          Set-Content -Path dist/installer-version.txt -Value $env:APP_VERSION -Encoding utf8
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc "/DAppVersion=$env:APP_VERSION" installer/lumi.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "dist/payload/Lumi-Internal-Setup.exe")) {
            throw "Внутренний установщик не найден в dist/payload."
          }

      - name: Build branded Lumi beta installer
        shell: pwsh
        env:
          APP_VERSION: ${{ inputs.version }}
          BETA_NUMBER: ${{ inputs.beta_number }}
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name LumiSetupBootstrap --icon dist/lumi.ico --add-data "dist/payload/Lumi-Internal-Setup.exe;payload" --add-data "dist/installer-version.txt;payload" --add-data "assets;assets" --distpath dist/bootstrap --workpath build/bootstrap src/lumi/installer_app.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "dist/bootstrap/LumiSetupBootstrap.exe" "dist/Lumi-Setup-$env:APP_VERSION-beta.$env:BETA_NUMBER.exe"

      - name: Generate installer checksum
        shell: pwsh
        env:
          APP_VERSION: ${{ inputs.version }}
          BETA_NUMBER: ${{ inputs.beta_number }}
        run: |
          $installer = Get-Item "dist/Lumi-Setup-$env:APP_VERSION-beta.$env:BETA_NUMBER.exe"
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer.Name)" | Out-File -Encoding ascii dist/SHA256SUMS.txt

      - name: Publish beta GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          APP_VERSION: ${{ inputs.version }}
          BETA_NUMBER: ${{ inputs.beta_number }}
          BETA_CHANGES: ${{ inputs.changes }}
        with:
          tag_name: v${{ inputs.version }}-beta.${{ inputs.beta_number }}
          name: Lumi AI v${{ inputs.version }} Beta ${{ inputs.beta_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: false
          body: |
            ⚠️ **БЕТА-ВЕРСИЯ — ТОЛЬКО ДЛЯ ТЕСТИРОВАНИЯ**

            Эта сборка предназначена для проверки новых функций Lumi AI. Она не является стабильным релизом и не должна предлагаться встроенным обновлятором.

            ## Что добавлено или исправлено
            ${{ inputs.changes }}

            Установщик: `Lumi-Setup-${{ inputs.version }}-beta.${{ inputs.beta_number }}.exe`.
          files: |
            dist/Lumi-Setup-*-beta.*.exe
            dist/SHA256SUMS.txt
